<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Switcharoo</title>
  <meta name="description" content="Move passwords, notes and small files between devices with QR codes. Nothing leaves your devices.">
  <meta name="theme-color" content="#eaf3ff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b82f6'/%3E%3Cpath d='M9 12h13l-4-4M23 20H10l4 4' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="vendor/qrcode.js" defer></script>
  <script type="module" src="js/landing.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="top">
    <a class="brand" href="./">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M9 12h13l-4-4M23 20H10l4 4"/></svg>
      <span>switcharoo</span>
    </a>
    <div class="top-end">
      <button class="icon theme" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24"><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></g></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="card hero">
      <div class="tile qr-tile">
        <canvas id="qr" aria-label="QR code that opens Switcharoo"></canvas>
      </div>

      <div class="side">
        <h1>Passwords and notes,<br>screen to camera.</h1>
        <p class="muted">Scan this with your other device to open Switcharoo there. No accounts, no servers, nothing uploaded.</p>
        <div class="url">
          <a id="url" href="app.html">app.html</a>
          <button class="icon" id="copy" aria-label="Copy link" title="Copy link">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/></svg>
          </button>
        </div>
        <div class="row">
          <a class="btn primary" id="open" href="app.html">Open app</a>
        </div>
      </div>
    </section>

    <ol class="steps">
      <li><b>1</b>Open Switcharoo on both devices</li>
      <li><b>2</b>Paste text or drop a file on the sender</li>
      <li><b>3</b>Point the other camera at the code</li>
    </ol>
  </main>
</body>
</html>
